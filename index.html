<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WerkstattKalk</title>
<style>
body{font-family:system-ui;background:#121821;color:#eef3f8;margin:0}
header{display:flex;gap:8px;align-items:center;padding:12px;background:#1a2332}
.logo{width:36px;height:36px;border-radius:10px;background:#e8a23a;color:#1a1408;display:grid;place-items:center;font-weight:800}
main{max-width:760px;margin:0 auto;padding:14px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;min-height:46px;font:inherit;cursor:pointer}
.primary{background:#e8a23a;color:#1a1408}.ghost{background:transparent;color:#eef3f8;border:1px solid #334058}
.card{background:#222c3d;border:1px solid #334058;border-radius:14px;padding:14px;margin:12px 0}
label{display:flex;flex-direction:column;gap:5px;margin:8px 0;color:#9aa8b8;font-size:13px}
input,select,textarea{background:#121821;color:#eef3f8;border:1px solid #334058;border-radius:10px;padding:10px;min-height:44px;font:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.hidden{display:none!important}.ok{color:#3ecf8e;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid #334058;background:#121821;color:#eef3f8;border-radius:999px;padding:9px 11px;min-height:42px}
.chip.on{background:#e8a23a;color:#1a1408;font-weight:700}
.kpi,.item{background:#121821;border-radius:12px;padding:12px;margin:8px 0}
.muted{color:#9aa8b8;font-size:13px}h1{font-size:1.25rem}h2{margin:0 0 8px;font-size:1.05rem}
dialog{background:#1a2332;color:#eef3f8;border:1px solid #334058;border-radius:16px;width:min(94vw,440px);padding:16px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img,.filechip{width:84px;height:84px;object-fit:cover;border-radius:8px;background:#111}
.filechip{display:grid;place-items:center;font-size:11px;text-align:center}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid #334058;text-align:left}
td.r{text-align:right}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#111}main{display:block!important;max-width:none}.card{border:1px solid #ccc;background:#fff}}
</style></head>
<body>
<header class="noprint"><div class="logo">WK</div><div style="flex:1"><strong>WerkstattKalk</strong></div>
<button type="button" class="btn ghost" onclick="openSet()">Einst.</button></header>
<main id="home">
<h1>Kundenordner</h1>
<div class="actions noprint">
<button type="button" class="btn primary" onclick="openCustDlg(0)">Neuer Kunde</button>
<button type="button" class="btn ghost" onclick="seed()">Beispiele ergaenzen</button>
</div>
<section class="card" id="custList"></section>
</main>
<main id="cust" class="hidden">
<div class="actions noprint">
<button type="button" class="btn ghost" onclick="goHome()">Zurueck</button>
<button type="button" class="btn ghost" onclick="openCustDlg(1)">Adresse</button>
<button type="button" class="btn primary" onclick="newQuote()">Neues Angebot</button>
</div>
<h1 id="custTitle">Kunde</h1>
<p class="muted" id="custAdr"></p>
<section class="card" id="quoteList"></section>
</main>
<main id="part" class="hidden">
<div class="actions noprint"><button type="button" class="btn ghost" onclick="backCust()">Zum Kundenordner</button>
<button type="button" class="btn ghost" onclick="doPrint()">Drucken / PDF</button></div>
<section class="card">
<h2>Teil</h2>
<label>Bezeichnung <input id="pname"></label>
<label>Artikelnr. <input id="drawingNo"></label>
<label>Stueck Fertigteil <input id="qty" type="number" value="1" min="1" oninput="sum()"></label>
</section>
<section class="card noprint">
<h2>Zeichnung / Foto</h2>
<div class="actions">
<label class="btn ghost">Foto Handy<input id="pic" type="file" accept="image/*" capture="environment" hidden onchange="addFile(this,1)"></label>
<label class="btn ghost">PDF<input id="pdf" type="file" accept="application/pdf" hidden onchange="addFile(this,0)"></label>
</div>
<div class="thumbs" id="thumbs"></div>
</section>
<section class="card">
<h2>Bearbeitungen</h2>
<div class="chips" id="chips"></div>
<div id="steps"></div>
</section>
<section class="card">
<h2>Positionen</h2>
<div id="pos"></div>
<div class="kpi">Netto <span class="ok" id="cNet">-</span></div>
<div class="kpi">Enthaltene MwSt. 19 % <span class="ok" id="cVat">-</span></div>
<div class="kpi">Brutto <span class="ok" id="cGross">-</span></div>
<button type="button" class="btn primary noprint" onclick="saveJob()">Im Kundenordner speichern</button>
</section>
</main>
<main id="setp" class="hidden">
<button type="button" class="btn ghost" onclick="goHome()">Zurueck</button>
<section class="card">
<h2>Stundensaetze EUR/h</h2>
<p class="muted">Nur Preise. Zeiten waehlst du im Angebot.</p>
<label>Laserschneiden <input id="r_cut" type="number"></label>
<label>Stanznippeln <input id="r_nip" type="number"></label>
<label>Stanzen <input id="r_punch" type="number"></label>
<label>Abkanten <input id="r_bend" type="number"></label>
<label>Schweissen <input id="r_weld" type="number"></label>
<label>Beizen <input id="r_pik" type="number"></label>
<label>Waschen / Reinigen <input id="r_wash" type="number"></label>
<label>Bolzenschiessen <input id="r_bolt" type="number"></label>
</section>
<button type="button" class="btn primary" onclick="saveSet()">Einstellungen speichern</button>
</main>
<dialog id="dlg">
<h3 id="dlgT">Kunde</h3>
<label>Firmenname <input id="dn"></label>
<label>Kd-Nr <input id="dk"></label>
<label>Strasse <input id="ds"></label>
<label>PLZ <input id="dz"></label>
<label>Ort <input id="do"></label>
<div class="actions">
<button type="button" class="btn ghost" onclick="document.getElementById('dlg').close()">Abbrechen</button>
<button type="button" class="btn primary" onclick="okCust()">OK</button>
</div>
</dialog>
<dialog id="bdlg">
<h3>Zeit je Kantung waehlen</h3>
<p class="muted">Tippe eine Zeile. Kein Raten zwischen Sekunden und Minuten.</p>
<div id="btab"></div>
<button type="button" class="btn ghost" onclick="document.getElementById('bdlg').close()">Schliessen</button>
</dialog>
<script>
function $(i){return document.getElementById(i)}
function N(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0}
function euro(n){return N(n).toFixed(2).replace('.',',')+' EUR'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,4)}
var STEPS=[
{k:'laser',n:'Laserschneiden',t:'min',r:'cut'},
{k:'nip',n:'Stanznippeln',t:'min',r:'nip'},
{k:'punch',n:'Stanzen',t:'min',r:'punch'},
{k:'bend',n:'Abkanten',t:'bend',r:'bend'},
{k:'mag',n:'MAG / MIG',t:'mm',r:'weld'},
{k:'wig',n:'WIG',t:'mm',r:'weld'},
{k:'lh',n:'Laserhand',t:'mm',r:'weld'},
{k:'lw',n:'Laserschweissen',t:'mm',r:'weld'},
{k:'bolt',n:'Bolzenschiessen',t:'bolt',r:'bolt'},
{k:'spot',n:'Punktschweissen',t:'spot',r:'weld'},
{k:'pik',n:'Beizen',t:'min',r:'pik'},
{k:'wash',n:'Waschen / Reinigen',t:'min',r:'wash'}
];
var BEND=[{s:15,l:'15 Sekunden'},{s:25,l:'25 Sekunden'},{s:45,l:'45 Sekunden'},{s:60,l:'1 Minute'},{s:90,l:'1 Minute 30 Sekunden'},{s:120,l:'2 Minuten'},{s:180,l:'3 Minuten'},{s:300,l:'5 Minuten'}];
var S={custs:[],quotes:[],cid:null,job:null,sel:[],v:{},files:[],edit:0,rates:{cut:95,nip:70,punch:70,bend:70,weld:75,pik:65,wash:55,bolt:70}};
function load(){try{S.custs=JSON.parse(localStorage.getItem('wk4c')||localStorage.getItem('wk3c')||'[]');S.quotes=JSON.parse(localStorage.getItem('wk4q')||localStorage.getItem('wk3q')||'[]');var r=JSON.parse(localStorage.getItem('wk4r')||'null');if(r){for(var k in r)S.rates[k]=r[k]}}catch(e){}}
function persist(){localStorage.setItem('wk4c',JSON.stringify(S.custs));localStorage.setItem('wk4q',JSON.stringify(S.quotes));localStorage.setItem('wk4r',JSON.stringify(S.rates))}
function show(id){['home','cust','part','setp'].forEach(function(x){$(x).classList.toggle('hidden',x!==id)})}
function goHome(){persist();show('home');listCust()}
function curC(){for(var i=0;i<S.custs.length;i++) if(S.custs[i].id===S.cid) return S.custs[i];return null}
function listCust(){var b=$('custList');if(!S.custs.length){b.innerHTML='<p class="muted">Noch kein Kundenordner.</p>';return}b.innerHTML=S.custs.map(function(c){var n=S.quotes.filter(function(q){return q.cid===c.id}).length;return '<article class="item" onclick="openC(\''+c.id+'\')"><strong>'+c.name+'</strong><div class="muted">'+(c.nr||'')+' · '+n+' Angebot(e)</div></article>'}).join('')}
function openCustDlg(edit){S.edit=edit?1:0;var c=edit?curC():null;$('dlgT').textContent=edit?'Adresse aendern':'Neuer Kunde';$('dn').value=c?c.name:'';$('dk').value=c?c.nr||'':'';$('ds').value=c?c.str||'':'';$('dz').value=c?c.plz||'':'';$('do').value=c?c.ort||'':'';$('dlg').showModal()}
function okCust(){var n=$('dn').value.trim();if(!n)return;if(S.edit&&S.cid){S.custs=S.custs.map(function(c){if(c.id!==S.cid)return c;c.name=n;c.nr=$('dk').value.trim();c.str=$('ds').value.trim();c.plz=$('dz').value.trim();c.ort=$('do').value.trim();return c})}else{S.custs.push({id:uid(),name:n,nr:$('dk').value.trim(),str:$('ds').value.trim(),plz:$('dz').value.trim(),ort:$('do').value.trim()})}persist();$('dlg').close();if(S.edit)openC(S.cid);else listCust()}
function seed(){var have={};S.custs.forEach(function(c){have[c.id]=1;have[c.name]=1});[{id:'ex1',name:'Bahntechnik Mueller',nr:'01',str:'Industriestr. 12',plz:'90411',ort:'Nuernberg'},{id:'ex2',name:'Fahrzeugbau Huber',nr:'02',str:'Werkweg 4',plz:'86150',ort:'Augsburg'}].forEach(function(e){if(!have[e.id]&&!have[e.name])S.custs.push(e)});persist();listCust()}
function openC(id){S.cid=id;var c=curC();$('custTitle').textContent=c?c.name:'Kunde';$('custAdr').textContent=c?[(c.nr?('Kd-Nr '+c.nr):''),c.str,[c.plz,c.ort].filter(Boolean).join(' ')].filter(Boolean).join(' · '):'';var qs=S.quotes.filter(function(q){return q.cid===id});$('quoteList').innerHTML=qs.length?qs.map(function(q){return '<article class="item" onclick="openQ(\''+q.id+'\')"><strong>'+q.name+'</strong><div class="muted">'+(q.zn||'')+'</div><div class="ok">'+(q.g||'')+'</div></article>'}).join(''):'<p class="muted">Noch kein Angebot in diesem Ordner.</p>';show('cust')}
function backCust(){persist();openC(S.cid)}
function stepBy(k){for(var i=0;i<STEPS.length;i++) if(STEPS[i].k===k) return STEPS[i];return STEPS[0]}
function drawChips(){$('chips').innerHTML=STEPS.map(function(s){return '<button type="button" class="chip'+(S.sel.indexOf(s.k)>=0?' on':'')+'" onclick="tog(\''+s.k+'\')">'+s.n+'</button>'}).join('')}
function tog(k){var i=S.sel.indexOf(k);if(i>=0)S.sel.splice(i,1);else S.sel.push(k);drawChips();drawSteps();sum()}
function bendLab(){var s=N(S.v.bsec);for(var i=0;i<BEND.length;i++) if(BEND[i].s===s) return BEND[i].l;return s?(s+' Sekunden'):'noch nicht gewaehlt'}
function drawSteps(){var h='';S.sel.forEach(function(k){var s=stepBy(k);
if(s.t==='bend')h+='<div class="item"><strong>Abkanten</strong><label>Anzahl Kantungen<input id="v_bend" type="number" value="'+(S.v.bend||'')+'" oninput="sum()"></label><p class="muted">Gewaehlte Zeit je Kantung: <b class="ok">'+bendLab()+'</b></p><button type="button" class="btn ghost" onclick="openBend()">Zeit-Tabelle oeffnen</button></div>';
else if(s.t==='bolt')h+='<label>Bolzenschiessen Stueck je Teil<input id="v_bolt" type="number" value="'+(S.v.bolt||'')+'" oninput="sum()"></label><p class="muted">Ohne extra Lohnzeit.</p>';
else if(s.t==='spot')h+='<label>Punktschweissen Minuten je Fertigteil<input id="v_spot" type="number" step="0.1" value="'+(S.v.spot||'')+'" oninput="sum()"></label>';
else if(s.t==='mm')h+='<label>'+s.n+' Gesamtlange mm<input id="v_'+k+'" type="number" value="'+(S.v[k]||'')+'" oninput="sum()"></label><label>Anzahl einzelne Naehte<input id="n_'+k+'" type="number" value="'+(S.v['n'+k]||1)+'" oninput="sum()"></label>';
else h+='<label>'+s.n+' Minuten je Stueck<input id="v_'+k+'" type="number" step="0.1" value="'+(S.v[k]||'')+'" oninput="sum()"></label>';
});$('steps').innerHTML=h||'<p class="muted">Bearbeitung oben antippen.</p>'}
function openBend(){$('btab').innerHTML=BEND.map(function(b){return '<div class="item" onclick="pickBend('+b.s+')"><strong>'+b.l+'</strong></div>'}).join('');$('bdlg').showModal()}
function pickBend(s){S.v.bsec=s;$('bdlg').close();drawSteps();sum()}
function read(){S.sel.forEach(function(k){if($('v_'+k))S.v[k]=N($('v_'+k).value);if($('n_'+k))S.v['n'+k]=N($('n_'+k).value)})}
function calc(){read();var q=N($('qty').value)||1,rows=[],net=0;
S.sel.forEach(function(k){var st=stepBy(k),rate=S.rates[st.r]||70,eur=0,txt=st.n,min=0;
if(st.t==='bend'){var n=N(S.v.bend),sec=N(S.v.bsec)||25;min=n*sec/60;eur=min*rate*q;txt='Abkanten '+n+' Kanten x '+bendLab()}
else if(st.t==='bolt'){eur=0;txt='Bolzenschiessen '+N(S.v.bolt)+' Stk'}
else if(st.t==='spot'){min=N(S.v.spot);eur=min*rate*q;txt='Punktschweissen '+min+' min'}
else if(st.t==='mm'){var mm=N(S.v[k]),ns=Math.max(1,N(S.v['n'+k])||1);min=mm/4/60+ns*20/60;eur=min*rate*q;txt=st.n+' '+mm+' mm, '+ns+' Naehte'}
else {min=N(S.v[k]);eur=min/60*rate*q;txt=st.n+' '+min+' min je Stk'}
rows.push({n:txt,eur:eur});net+=eur});
return {rows:rows,net:net,vat:net*.19,gross:net*1.19,q:q}}
function sum(){var p=calc();$('pos').innerHTML='<table><tr><th>Position</th><th class="r"></th></tr>'+p.rows.map(function(r){return '<tr><td>'+r.n+'</td><td class="r">'+euro(r.eur)+'</td></tr>'}).join('')+'</table>';$('cNet').textContent=euro(p.net);$('cVat').textContent=euro(p.vat);$('cGross').textContent=euro(p.gross)}
function drawFiles(){var b=$('thumbs');b.innerHTML=S.files.map(function(f,i){var inn=f.t==='img'?'<img src="'+f.d+'">':'<div class="filechip">PDF<br>'+f.n+'</div>';return '<div>'+inn+'<button type="button" class="btn ghost noprint" onclick="delFile('+i+')">X</button></div>'}).join('')||'<p class="muted">Kein Plan.</p>'}
function delFile(i){S.files.splice(i,1);drawFiles()}
function addFile(inp,img){var f=inp.files[0];if(!f)return;if(img){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas'),w=im.width,h=im.height,m=1100;if(w>m){h=h*m/w;w=m}c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);S.files.push({n:f.name,t:'img',d:c.toDataURL('image/jpeg',.68)});drawFiles()};im.src=r.result};r.readAsDataURL(f)}else{if(f.size>900000){alert('PDF zu gross');return}var r=new FileReader();r.onload=function(){S.files.push({n:f.name,t:'pdf',d:r.result});drawFiles()};r.readAsDataURL(f)}inp.value=''}
function fillJob(j){S.job=j;S.sel=(j.sel||[]).slice();S.v=Object.assign({},j.v||{});S.files=(j.files||[]).slice();$('pname').value=j.name||'';$('drawingNo').value=j.zn||'';$('qty').value=j.qty||1;drawChips();drawSteps();drawFiles();show('part');sum()}
function newQuote(){fillJob({id:uid(),cid:S.cid,name:'',zn:'',qty:1,sel:[],v:{},files:[]})}
function openQ(id){var q=S.quotes.filter(function(x){return x.id===id})[0];if(q)fillJob(JSON.parse(JSON.stringify(q)))}
function saveJob(){read();if(!$('pname').value.trim()){alert('Bezeichnung angeben');return}var p=calc();var j={id:S.job&&S.job.id?S.job.id:uid(),cid:S.cid,name:$('pname').value.trim(),zn:$('drawingNo').value.trim(),qty:N($('qty').value)||1,sel:S.sel.slice(),v:Object.assign({},S.v),files:S.files.slice(),g:euro(p.gross)};S.quotes=S.quotes.filter(function(x){return x.id!==j.id});S.quotes.unshift(j);persist();openC(S.cid)}
function openSet(){$('r_cut').value=S.rates.cut;$('r_nip').value=S.rates.nip;$('r_punch').value=S.rates.punch;$('r_bend').value=S.rates.bend;$('r_weld').value=S.rates.weld;$('r_pik').value=S.rates.pik;$('r_wash').value=S.rates.wash;$('r_bolt').value=S.rates.bolt;show('setp')}
function saveSet(){S.rates.cut=N($('r_cut').value);S.rates.nip=N($('r_nip').value);S.rates.punch=N($('r_punch').value);S.rates.bend=N($('r_bend').value);S.rates.weld=N($('r_weld').value);S.rates.pik=N($('r_pik').value);S.rates.wash=N($('r_wash').value);S.rates.bolt=N($('r_bolt').value);persist();goHome()}
function doPrint(){window.print()}
load();listCust();
</script></body></html>
