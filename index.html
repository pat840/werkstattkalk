<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WerkstattKalk</title>
<style>
:root{--bg:#121821;--card:#222c3d;--line:#334058;--text:#eef3f8;--muted:#9aa8b8;--accent:#e8a23a;--ok:#3ecf8e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:12px 16px;background:#1a2332;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#1a1408;display:grid;place-items:center;font-weight:800}
.brand{flex:1}.brand small{display:block;color:var(--muted);font-size:12px}
button{font:inherit;cursor:pointer}
.icon{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
main{max-width:740px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:1.4rem;margin:.2rem 0 .6rem}h2{margin:0 0 10px;font-size:1.08rem}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin:8px 0}
input,select,textarea{background:#121821;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:700;min-height:48px}
.primary{background:var(--accent);color:#1a1408}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.link{background:none;border:0;color:#7eb0ff;min-height:44px;padding:8px}
.item{background:#121821;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:56px}
.ok{color:var(--ok);font-weight:700;text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:16px;background:#1a2332;color:var(--text);width:min(92vw,420px);padding:16px}
.check{flex-direction:row;align-items:center}.check input{width:18px;min-height:auto}
#sheet{display:none}
@media print{header,.no-print,dialog,main{display:none!important}body{background:#fff;color:#111}#sheet{display:block!important;padding:12px}#sheet table{width:100%;border-collapse:collapse}#sheet td,#sheet th{border:1px solid #ccc;padding:6px;font-size:12px}}
</style>
</head>
<body>
<header class="no-print">
<button type="button" class="icon" id="btnBack" hidden>Zurueck</button>
<div class="logo">WK</div>
<div class="brand"><strong id="ht">WerkstattKalk</strong><small id="hs">Angebotskalkulation</small></div>
<button type="button" class="icon" id="btnSet">Einst.</button>
</header>
<main id="home">
<p class="eyebrow">Kunden</p>
<h1>Kunde waehlen oder anlegen.</h1>
<div class="actions">
<button type="button" class="btn primary" id="btnNewCust">Neuer Kunde</button>
<button type="button" class="btn ghost" id="btnDemo">Beispiele laden</button>
</div>
<section class="card" id="custList"></section>
</main>
<main id="cust" class="hidden">
<p class="eyebrow" id="custEye">Kunde</p>
<h1 id="custTitle">Kunde</h1>
<div class="actions"><button type="button" class="btn primary" id="btnNewQuote">Neues Angebot</button></div>
<section class="card" id="quoteList"></section>
</main>
<main id="part" class="hidden">
<section class="card">
<h2>Angebot</h2>
<div class="grid2">
<label>Angebotsnr. <input id="quoteNo" placeholder="01-0815"></label>
<label>Datum <input id="quoteDate" type="date"></label>
</div>
<label>Teil <input id="pname"></label>
<div class="grid2">
<label>Zeichnung <input id="drawingNo"></label>
<label>Stueckzahl <input id="qty" type="number" value="1" min="1"></label>
</div>
<div class="grid2">
<label>Werkstoff <select id="materialSel"></select></label>
<label>Dicke mm <input id="thicknessMm" type="number" step="0.1"></label>
</div>
<label>Notiz <textarea id="note" rows="2"></textarea></label>
</section>
<section class="card">
<h2>Tafel / Material</h2>
<div class="grid2">
<label>L mm <input id="lenMm" type="number"></label>
<label>B mm <input id="widMm" type="number"></label>
<label>kg <input id="weightKg" type="number" step="0.01"></label>
<label>Tafeln <input id="sheets" type="number" value="0"></label>
<label>Tafel EUR <input id="sheetPrice" type="number" step="0.01"></label>
<label>EUR/kg <input id="euroPerKg" type="number" step="0.01"></label>
</div>
<label class="check"><input type="checkbox" id="useSheetPrice"> Tafelpreis verwenden</label>
</section>
<section class="card">
<div class="row"><h2>Prozesse</h2><button type="button" class="btn ghost" id="btnAddP">Prozess dazu</button></div>
<div id="procs"></div>
</section>
<section class="card">
<div class="row"><h2>Zukaufteile</h2><button type="button" class="btn ghost" id="btnAddB">Teil dazu</button></div>
<div id="buys"></div>
</section>
<section class="card">
<h2>Summe</h2>
<div class="grid2">
<div><div class="muted">Lohn</div><div class="ok" id="cLabor">-</div></div>
<div><div class="muted">Material</div><div class="ok" id="cMat">-</div></div>
<div><div class="muted">Zukauf</div><div class="ok" id="cBuy">-</div></div>
<div><div class="muted">Angebot</div><div class="ok" id="cLot">-</div></div>
</div>
</section>
<div class="actions no-print">
<button type="button" class="btn primary" id="btnSave">Speichern</button>
<button type="button" class="btn ghost" id="btnRev">Als /2 speichern</button>
<button type="button" class="btn ghost" id="btnPrint">Drucken</button>
</div>
</main>
<main id="settings" class="hidden">
<section class="card">
<h2>Firmenkopf Druck</h2>
<label>Firmenname <input id="shopName"></label>
<label>Adresse <input id="shopAddr"></label>
</section>
<section class="card">
<label>Verschnitt % <input id="scrapPct" type="number" value="15"></label>
<label>Aufschlag % <input id="markupPct" type="number" value="0"></label>
</section>
<section class="card">
<h2>Stundensatz EUR/h</h2>
<div id="rates"></div>
</section>
<section class="card">
<h2>Werkstoff EUR/kg</h2>
<div id="matEd"></div>
</section>
<div class="actions"><button type="button" class="btn primary" id="btnSaveSet">Einstellungen speichern</button></div>
</main>
<div id="sheet"></div>
<dialog id="dlg">
<h3 id="dlgT">Eintrag</h3>
<div id="dlgB"></div>
<div class="actions">
<button type="button" class="btn ghost" id="dlgX">Abbrechen</button>
<button type="button" class="btn primary" id="dlgOK">OK</button>
</div>
</dialog>
<script>
(function(){
function $(id){return document.getElementById(id);}
function jget(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}}
function jset(k,v){localStorage.setItem(k,JSON.stringify(v));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function today(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function euro(n){n=Number(n)||0;return n.toFixed(2).replace(".",",")+" EUR";}
var PROC={laserhand:{l:"Laserhand",mms:8,setup:8,ex:15,eur:75},mag:{l:"MAG",mms:4,setup:12,ex:25,eur:75},wig:{l:"WIG",mms:2,setup:15,ex:30,eur:85},laser_cut:{l:"Laserschneiden",mms:20,setup:6,ex:10,eur:95,pierce:1.5},bend:{l:"Abkanten",sec:25,setup:10,ex:10,eur:70},mill:{l:"Fraesen",run:15,setup:20,ex:10,eur:80}};
var KEYS=Object.keys(PROC);
var MATS0=[{id:"S235JR",n:"S235JR",d:7.85,e:1.2},{id:"S355JR",n:"S355JR",d:7.85,e:1.35},{id:"1.4301",n:"1.4301 V2A",d:8,e:4.8},{id:"1.4571",n:"1.4571",d:8,e:6.5},{id:"sonst",n:"Sonstiges",d:7.85,e:0}];
var S={view:"home",cid:null,job:null,dlg:null,params:Object.assign({},PROC,jget("wk_p",{})),mats:jget("wk_m",null)||MATS0.slice(),set:Object.assign({scrap:15,mark:0,shop:"",addr:""},jget("wk_s",{})),custs:jget("wk_c",[]),quotes:jget("wk_q",[])};
function save(){jset("wk_c",S.custs);jset("wk_q",S.quotes);jset("wk_s",S.set);jset("wk_p",S.params);jset("wk_m",S.mats);}
function show(v){S.view=v;["home","cust","part","settings"].forEach(function(id){$(id).classList.toggle("hidden",id!==v);});$("btnBack").hidden=v==="home";if(v==="home"){$("ht").textContent="WerkstattKalk";$("hs").textContent="Angebotskalkulation";}}
function findC(id){for(var i=0;i<S.custs.length;i++) if(S.custs[i].id===id) return S.custs[i]; return {name:"",nr:""};}
function findM(id){for(var i=0;i<S.mats.length;i++) if(S.mats[i].id===id) return S.mats[i]; return S.mats[0];}
function pcost(pr,qty){var p=S.params[pr.t]||PROC[pr.t]||{}, each=0, setup=Number(p.setup)||0, rate=Number(p.eur)||0, ex=1+(Number(p.ex)||0)/100; if(pr.t==="laserhand"||pr.t==="mag"||pr.t==="wig") each=(((Number(pr.mm)||0)/(Number(p.mms)||1))/60)*ex; else if(pr.t==="laser_cut") each=((((Number(pr.mm)||0)/(Number(p.mms)||1))+((Number(pr.pi)||0)*(Number(p.pierce)||0)))/60)*ex; else if(pr.t==="bend") each=(((Number(pr.b)||0)*(Number(p.sec)||0))/60)*ex; else if(pr.t==="mill") each=(Number(pr.run)||Number(p.run)||0)*ex; var ce=each/60*rate, cs=setup/60*rate; return {l:p.l||pr.t, each:each, ce:ce, lot:cs+ce*(Number(qty)||1)};}
function wt(j){if(Number(j.kg)>0) return Number(j.kg); var L=Number(j.L)||0,B=Number(j.B)||0,T=Number(j.t)||0; if(L&&B&&T) return L*B*T*(findM(j.mat).d||7.85)/1e6; return 0;}
function calc(j){var q=Number(j.qty)||1, rows=(j.ps||[]).map(function(p){return Object.assign({},p,pcost(p,q));}); var labor=0; rows.forEach(function(r){labor+=r.lot;}); var mat=0, scrap=1+(Number(S.set.scrap)||0)/100; if(j.useT&&Number(j.tp)>0) mat=(Number(j.sh)||1)*Number(j.tp); else {var ep=Number(j.epk)>0?Number(j.epk):Number(findM(j.mat).e)||0; mat=wt(j)*scrap*ep*q;} var buy=0;(j.bs||[]).forEach(function(b){var x=(Number(b.n)||0)*(Number(b.p)||0); buy+=b.pp?x*q:x;}); var tot=(labor+mat+buy)*(1+(Number(S.set.mark)||0)/100); return {rows:rows,labor:labor,mat:mat,buy:buy,tot:tot,q:q};}
function nextRev(no){no=String(no||"Angebot"); var m=no.match(/^(.*?)(?:\/(\d+))?$/); return m[1]+"/"+(m[2]?Number(m[2])+1:2);}
function seed(){S.custs=[{id:"c1",name:"Bahntechnik Mueller",nr:"01"},{id:"c2",name:"Fahrzeugbau Huber",nr:"02"}]; S.quotes=[{id:"q1",cid:"c1",no:"01-0815",dt:today(),name:"Konsolblech Drehgestell",zn:"SF-8841-A",qty:8,mat:"S355JR",t:8,note:"Beispiel",L:420,B:180,kg:"",sh:1,tp:85,epk:"",useT:true,ps:[{t:"laser_cut",mm:1400,pi:6},{t:"bend",b:4},{t:"mag",mm:620}],bs:[{name:"Buchse M8",n:2,p:1.2,pp:true}]}]; save();}
function listCust(){var box=$("custList"); if(!S.custs.length){box.innerHTML='<p class="muted">Noch kein Kunde.</p>';return;} box.innerHTML=S.custs.map(function(c){var n=S.quotes.filter(function(q){return q.cid===c.id;}).length; return '<article class="item" data-open-c="'+c.id+'"><div><strong>'+esc(c.name)+'</strong><div class="muted">Kd-Nr. '+esc(c.nr||"-")+' · '+n+' Angebot(e)</div></div><div class="muted">oeffnen</div></article>';}).join("");}
function listQ(){var box=$("quoteList"), list=S.quotes.filter(function(q){return q.cid===S.cid;}); if(!list.length){box.innerHTML='<p class="muted">Noch kein Angebot.</p>';return;} box.innerHTML=list.map(function(q){var t=calc(q);return '<article class="item" data-open-q="'+q.id+'"><div><strong>'+esc(q.no)+'</strong><div class="muted">'+esc(q.name)+' · '+esc(q.dt)+'</div></div><div class="ok">'+euro(t.tot)+'</div></article>';}).join("");}
function openC(id){S.cid=id; var c=findC(id); $("custTitle").textContent=c.name; $("custEye").textContent="Kd-Nr. "+(c.nr||"-"); $("ht").textContent=c.name; $("hs").textContent="Angebote"; listQ(); show("cust");}
function fillMat(val){$("materialSel").innerHTML=S.mats.map(function(m){return '<option value="'+m.id+'">'+esc(m.n)+'</option>';}).join(""); if(val) $("materialSel").value=val;}
function emptyJ(){var c=findC(S.cid); return {id:uid(),cid:S.cid,no:(c.nr?c.nr+"-":""),dt:today(),name:"",zn:"",qty:1,mat:"S355JR",t:"",note:"",L:"",B:"",kg:"",sh:0,tp:"",epk:"",useT:false,ps:[],bs:[]};}
function fillJ(j){S.job=j; fillMat(j.mat); $("quoteNo").value=j.no||""; $("quoteDate").value=j.dt||today(); $("pname").value=j.name||""; $("drawingNo").value=j.zn||""; $("qty").value=j.qty||1; $("thicknessMm").value=j.t||""; $("note").value=j.note||""; $("lenMm").value=j.L||""; $("widMm").value=j.B||""; $("weightKg").value=j.kg||""; $("sheets").value=j.sh||0; $("sheetPrice").value=j.tp||""; $("euroPerKg").value=j.epk||""; $("useSheetPrice").checked=!!j.useT; drawP(); drawB(); sum();}
function readJ(){var j=S.job; j.no=$("quoteNo").value.trim(); j.dt=$("quoteDate").value; j.name=$("pname").value.trim(); j.zn=$("drawingNo").value.trim(); j.qty=Number($("qty").value)||1; j.mat=$("materialSel").value; j.t=$("thicknessMm").value; j.note=$("note").value.trim(); j.L=$("lenMm").value; j.B=$("widMm").value; j.kg=$("weightKg").value; j.sh=$("sheets").value; j.tp=$("sheetPrice").value; j.epk=$("euroPerKg").value; j.useT=$("useSheetPrice").checked;}
function drawP(){var b=$("procs"); if(!S.job.ps.length){b.innerHTML='<p class="muted">Kein Prozess.</p>';return;} b.innerHTML=S.job.ps.map(function(p,i){var r=pcost(p,S.job.qty||1);return '<article class="item" data-ed-p="'+i+'"><div><strong>'+esc(r.l)+'</strong></div><div class="ok">'+euro(r.ce)+'</div></article>';}).join("");}
function drawB(){var b=$("buys"); if(!S.job.bs.length){b.innerHTML='<p class="muted">Kein Zukauf.</p>';return;} b.innerHTML=S.job.bs.map(function(x,i){return '<article class="item"><div><strong>'+esc(x.name)+'</strong><div class="muted">'+x.n+' x '+euro(x.p)+'</div></div><button type="button" class="link" data-del-b="'+i+'">Loeschen</button></article>';}).join("");}
function sum(){if(!S.job) return; readJ(); var t=calc(S.job); $("cLabor").textContent=euro(t.labor); $("cMat").textContent=euro(t.mat); $("cBuy").textContent=euro(t.buy); $("cLot").textContent=euro(t.tot);}
function persist(asNew){readJ(); if(!S.job.name){alert("Bitte Teilname angeben."); return false;} if(asNew){S.job.id=uid(); S.job.no=nextRev(S.job.no); S.job.dt=today();} S.quotes=S.quotes.filter(function(q){return q.id!==S.job.id;}); S.quotes.unshift(JSON.parse(JSON.stringify(S.job))); save(); return true;}
function printQ(){readJ(); var t=calc(S.job), c=findC(S.job.cid); var rows=t.rows.map(function(r,i){return "<tr><td>"+(i+1)+"</td><td>"+esc(r.l)+"</td><td>"+t.q+"</td><td>"+euro(r.ce)+"</td><td>"+euro(r.lot)+"</td></tr>";}).join(""); rows+="<tr><td></td><td>Material</td><td></td><td></td><td>"+euro(t.mat)+"</td></tr>"; rows+="<tr><td></td><td>Zukauf</td><td></td><td></td><td>"+euro(t.buy)+"</td></tr>"; $("sheet").innerHTML="<h1>"+esc(S.set.shop||"Angebot")+"</h1><p>"+esc(S.set.addr)+"</p><p><b>Angebot "+esc(S.job.no)+"</b> vom "+esc(S.job.dt)+"</p><p>Kunde: "+esc(c.name)+" (Kd-Nr. "+esc(c.nr)+")</p><p>Teil: "+esc(S.job.name)+" · "+t.q+" Stk.</p><table><tr><th>Pos</th><th>Bezeichnung</th><th>Menge</th><th>je Stk.</th><th>Gesamt</th></tr>"+rows+"</table><p><b>Summe "+euro(t.tot)+"</b></p>"; window.print();}
function openDlg(kind,extra){S.dlg={k:kind,x:extra}; if(kind==="cust"){$("dlgT").textContent="Neuer Kunde"; $("dlgB").innerHTML='<label>Name <input id="dn"></label><label>Kunden-Nr. <input id="dk" placeholder="01"></label>';} if(kind==="proc"){$("dlgT").textContent="Prozess"; $("dlgB").innerHTML='<label>Art <select id="dt">'+KEYS.map(function(k){return '<option value="'+k+'">'+PROC[k].l+'</option>';}).join("")+'</select></label><label>Mass (mm / Kanten / min) <input id="dv" type="number"></label>';} if(kind==="buy"){$("dlgT").textContent="Zukauf"; $("dlgB").innerHTML='<label>Name <input id="bn"></label><div class="grid2"><label>Menge <input id="bq" type="number" value="1"></label><label>EUR <input id="bp" type="number" step="0.01"></label></div><label class="check"><input type="checkbox" id="bpp" checked> je Fertigteil</label>';} $("dlg").showModal();}
function okDlg(){var d=S.dlg; if(!d) return; if(d.k==="cust"){var n=$("dn").value.trim(); if(!n){alert("Name fehlt");return;} S.custs.push({id:uid(),name:n,nr:$("dk").value.trim()}); save(); listCust();} if(d.k==="proc"){var t=$("dt").value, v=Number($("dv").value)||0, p={t:t}; if(t==="bend") p.b=v; else if(t==="mill") p.run=v; else {p.mm=v; if(t==="laser_cut") p.pi=2;} if(d.x!=null) S.job.ps[d.x]=p; else S.job.ps.push(p); drawP(); sum();} if(d.k==="buy"){S.job.bs.push({name:$("bn").value.trim()||"Zukauf",n:Number($("bq").value)||0,p:Number($("bp").value)||0,pp:$("bpp").checked}); drawB(); sum();} $("dlg").close();}
function setPage(){$("shopName").value=S.set.shop||""; $("shopAddr").value=S.set.addr||""; $("scrapPct").value=S.set.scrap; $("markupPct").value=S.set.mark; $("rates").innerHTML=KEYS.map(function(k){return '<label>'+PROC[k].l+' <input data-r="'+k+'" type="number" value="'+(S.params[k]&&S.params[k].eur!=null?S.params[k].eur:PROC[k].eur)+'"></label>';}).join(""); $("matEd").innerHTML=S.mats.map(function(m,i){return '<label>'+esc(m.n)+' <input data-m="'+i+'" type="number" step="0.01" value="'+m.e+'"></label>';}).join(""); show("settings");}
$("btnNewCust").onclick=function(){openDlg("cust");};
$("btnDemo").onclick=function(){seed(); listCust();};
$("btnSet").onclick=setPage;
$("btnBack").onclick=function(){ if(S.view==="part") openC(S.cid); else {show("home"); listCust();} };
$("btnNewQuote").onclick=function(){ fillJ(emptyJ()); $("ht").textContent="Neues Angebot"; show("part"); };
$("btnAddP").onclick=function(){openDlg("proc");};
$("btnAddB").onclick=function(){openDlg("buy");};
$("btnSave").onclick=function(){ if(persist(false)) openC(S.cid); };
$("btnRev").onclick=function(){ if(persist(true)){ fillJ(S.job); alert("Gespeichert als "+S.job.no);} };
$("btnPrint").onclick=printQ;
$("btnSaveSet").onclick=function(){ S.set.shop=$("shopName").value.trim(); S.set.addr=$("shopAddr").value.trim(); S.set.scrap=Number($("scrapPct").value)||0; S.set.mark=Number($("markupPct").value)||0; document.querySelectorAll("[data-r]").forEach(function(i){ S.params[i.dataset.r]=Object.assign({},PROC[i.dataset.r],S.params[i.dataset.r]||{},{eur:Number(i.value)}); }); document.querySelectorAll("[data-m]").forEach(function(i){ S.mats[Number(i.dataset.m)].e=Number(i.value); }); save(); alert("Gespeichert"); show("home"); listCust(); };
$("dlgOK").onclick=okDlg;
$("dlgX").onclick=function(){$("dlg").close();};
$("custList").onclick=function(e){var a=e.target.closest("[data-open-c]"); if(a) openC(a.getAttribute("data-open-c"));};
$("quoteList").onclick=function(e){var a=e.target.closest("[data-open-q]"); if(!a) return; var q=S.quotes.filter(function(x){return x.id===a.getAttribute("data-open-q");})[0]; if(q){ fillJ(JSON.parse(JSON.stringify(q))); $("ht").textContent=q.no; show("part"); }};
$("procs").onclick=function(e){var a=e.target.closest("[data-ed-p]"); if(a) openDlg("proc", Number(a.getAttribute("data-ed-p")));};
$("buys").onclick=function(e){var a=e.target.closest("[data-del-b]"); if(a){ S.job.bs.splice(Number(a.getAttribute("data-del-b")),1); drawB(); sum(); }};
