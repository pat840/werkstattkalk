<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>WerkstattKalk</title>
<style>body{font-family:system-ui;background:#121821;color:#eef3f8;margin:0}header{display:flex;gap:10px;align-items:center;padding:12px;background:#1a2332}.logo{width:36px;height:36px;border-radius:10px;background:#e8a23a;color:#1a1408;display:grid;place-items:center;font-weight:800}main{max-width:740px;margin:0 auto;padding:16px}.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:700;min-height:48px;font:inherit;cursor:pointer}.primary{background:#e8a23a;color:#1a1408}.ghost{background:transparent;color:#eef3f8;border:1px solid #334058}.card{background:#222c3d;border:1px solid #334058;border-radius:14px;padding:14px;margin:12px 0}label{display:flex;flex-direction:column;gap:6px;margin:8px 0;color:#9aa8b8}input,select{background:#121821;color:#eef3f8;border:1px solid #334058;border-radius:10px;padding:11px;min-height:44px;font:inherit}input[readonly]{color:#3ecf8e;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.ok{color:#3ecf8e;font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #334058;background:#121821;color:#eef3f8;border-radius:999px;padding:10px 12px;min-height:44px;cursor:pointer}.chip.on{background:#e8a23a;color:#1a1408}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}.kpi{background:#121821;border-radius:12px;padding:10px;margin:8px 0}.item{background:#121821;border-radius:12px;padding:12px;margin:8px 0}dialog{background:#1a2332;color:#eef3f8;border:1px solid #334058;border-radius:16px;width:min(92vw,420px);padding:16px}.muted{color:#9aa8b8}</style></head>
<body>
<header><div class="logo">WK</div><div><strong>WerkstattKalk</strong><div class="muted" id="hs">tippe die orangene Flaeche</div></div></header>
<main id="home">
<h1>Start</h1>
<div class="actions">
<button type="button" class="btn primary" id="btnNewCust" onclick="openCustDlg()">Neuer Kunde</button>
<button type="button" class="btn ghost" id="btnDemo" onclick="seed();listCust();">Beispiele laden</button>
</div>
<section class="card" id="custList"></section>
</main>
<main id="cust" class="hidden">
<button type="button" class="btn ghost" onclick="goHome()">Zurueck</button>
<h1 id="custTitle">Kunde</h1>
<button type="button" class="btn primary" onclick="newQuote()">Neues Angebot</button>
<section class="card" id="quoteList"></section>
</main>
<main id="part" class="hidden">
<button type="button" class="btn ghost" onclick="backCust()">Zurueck</button>
<section class="card">
<label>Teil <input id="pname"></label>
<label>Artikelnr. <input id="drawingNo"></label>
<label>Stueck <input id="qty" type="number" value="1"></label>
<label>Werkstoff <select id="materialSel" onchange="sum()"></select></label>
<label>Staerke <select id="thicknessMm" onchange="sum()"></select></label>
<label>Format <select id="fmt" onchange="togFree();sum();"></select></label>
<div class="grid2 hidden" id="freeBox"><label>L mm <input id="lenMm" type="number" oninput="sum()"></label><label>B mm <input id="widMm" type="number" oninput="sum()"></label></div>
<div class="kpi"><div class="muted">Gewicht (nur Rechnung)</div><input id="autoKg" readonly><div class="muted" id="autoHint"></div></div>
</section>
<section class="card"><div class="chips" id="chips"></div><div id="steps"></div></section>
<section class="card">
<div class="kpi">Netto <span class="ok" id="cNet">-</span></div>
<div class="kpi">Enthaltene MwSt. 19% <span class="ok" id="cVat">-</span></div>
<div class="kpi">Brutto <span class="ok" id="cGross">-</span></div>
<button type="button" class="btn primary" onclick="saveJob()">Speichern</button>
</section>
</main>
<dialog id="dlg"><h3>Neuer Kunde</h3><label>Name <input id="dn"></label><label>Kd-Nr <input id="dk"></label><div class="actions"><button type="button" class="btn ghost" onclick="document.getElementById('dlg').close()">Abbrechen</button><button type="button" class="btn primary" onclick="okCust()">OK</button></div></dialog>
<script>
function $(id){return document.getElementById(id);}
function N(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0;}
function euro(n){return N(n).toFixed(2).replace('.',',')+' EUR';}
function kg(n){return N(n).toFixed(2).replace('.',',')+' kg';}
var TH=['0.63','0.75','0.80','1.00','1.25','1.50','2.00','2.50','3.00','4.00','5.00','6.00','8.00','10.00','12.00','15.00','20.00'];
var FM=[{id:'k',n:'Kleinformat 2000 x 1000',L:2000,B:1000},{id:'m',n:'Mittelformat 2500 x 1250',L:2500,B:1250},{id:'g',n:'Grossformat 3000 x 1500',L:3000,B:1500},{id:'f',n:'Freie Masse',L:0,B:0}];
var MATS=[{id:'S235JR',n:'S235JR',d:7.85},{id:'S355JR',n:'S355JR',d:7.85},{id:'1.4301',n:'1.4301',d:8},{id:'1.4571',n:'1.4571',d:8}];
var STEPS=[['bend','Abkanten'],['mag','MAG / MIG'],['wig','WIG'],['bolt','Bolzenschiessen'],['spot','Punktschweissen'],['pik','Beizen'],['wash','Reinigen / Waschen']];
var S={custs:[],quotes:[],cid:null,job:null,sel:[]};
function load(){try{S.custs=JSON.parse(localStorage.getItem('wk_c')||'[]');S.quotes=JSON.parse(localStorage.getItem('wk_q')||'[]');}catch(e){S.custs=[];S.quotes=[];}}
function save(){localStorage.setItem('wk_c',JSON.stringify(S.custs));localStorage.setItem('wk_q',JSON.stringify(S.quotes));}
function show(id){['home','cust','part'].forEach(function(x){$(x).classList.toggle('hidden',x!==id);});}
function goHome(){show('home');listCust();}
function listCust(){var b=$('custList'); if(!S.custs.length){b.innerHTML='<p class="muted">Noch kein Kunde. Tippe Neuer Kunde.</p>';return;} b.innerHTML=S.custs.map(function(c){return '<article class="item" onclick="openC(\''+c.id+'\')"><strong>'+c.name+'</strong><div class="muted">'+c.nr+'</div></article>';}).join('');}
function openCustDlg(){$('dn').value='';$('dk').value='';$('dlg').showModal();}
function okCust(){var n=$('dn').value.trim(); if(!n)return; S.custs.push({id:Date.now().toString(36),name:n,nr:$('dk').value.trim()}); save(); $('dlg').close(); listCust();}
function seed(){S.custs=[{id:'c1',name:'Bahntechnik Mueller',nr:'01'},{id:'c2',name:'Fahrzeugbau Huber',nr:'02'}]; save();}
function openC(id){S.cid=id; var c=S.custs.filter(function(x){return x.id===id;})[0]; $('custTitle').textContent=c?c.name:'Kunde'; var qs=S.quotes.filter(function(q){return q.cid===id;}); $('quoteList').innerHTML=qs.length?qs.map(function(q){return '<article class="item"><strong>'+q.name+'</strong></article>';}).join(''):'<p class="muted">Noch kein Angebot.</p>'; show('cust');}
function backCust(){openC(S.cid);}
function fillSelects(){$('materialSel').innerHTML=MATS.map(function(m){return '<option value="'+m.id+'">'+m.n+'</option>';}).join(''); $('thicknessMm').innerHTML=TH.map(function(t){return '<option value="'+t+'">'+t.replace('.',',')+' mm</option>';}).join(''); $('fmt').innerHTML=FM.map(function(f){return '<option value="'+f.id+'">'+f.n+'</option>';}).join(''); $('thicknessMm').value='8.00'; $('fmt').value='k'; $('chips').innerHTML=STEPS.map(function(s){return '<button type="button" class="chip" data-k="'+s[0]+'" onclick="tog(this)">'+s[1]+'</button>';}).join('');}
function tog(btn){btn.classList.toggle('on'); var k=btn.getAttribute('data-k'); if(S.sel.indexOf(k)>=0) S.sel=S.sel.filter(function(x){return x!==k;}); else S.sel.push(k); drawSteps(); sum();}
function drawSteps(){var h=''; if(S.sel.indexOf('bend')>=0) h+='<label>Kantungen je Stueck <input id="bends" type="number" value="1" oninput="sum()"></label>'; $('steps').innerHTML=h||'<p class="muted">Schritte oben waehlen. Abkanten = Stueckzahl Kanten.</p>';}
function togFree(){var f=$('fmt').value==='f'; $('freeBox').classList.toggle('hidden',!f); if(!f){var x=FM.filter(function(z){return z.id===$('fmt').value;})[0]; $('lenMm').value=x.L; $('widMm').value=x.B;}}
function size(){var id=$('fmt').value,f=FM.filter(function(z){return z.id===id;})[0]; if(id!=='f') return f; return {L:N($('lenMm').value),B:N($('widMm').value)};}
function dens(){var id=$('materialSel').value; for(var i=0;i<MATS.length;i++) if(MATS[i].id===id) return MATS[i].d; return 7.85;}
function sum(){var s=size(),t=N($('thicknessMm').value),w=(!s.L||!s.B||!t)?0:(s.L*s.B*t*dens()/1e6); $('autoKg').value=kg(w); $('autoHint').textContent=s.L+' x '+s.B+' x '+t+' mm'; var net=w*1.15*1.35*N($('qty').value||1); if(S.sel.indexOf('bend')>=0) net+=N($('bends')&&$('bends').value)*2; var vat=net*0.19; $('cNet').textContent=euro(net); $('cVat').textContent=euro(vat); $('cGross').textContent=euro(net+vat);}
function newQuote(){S.sel=[]; fillSelects(); togFree(); $('pname').value=''; show('part'); sum();}
function saveJob(){if(!$('pname').value.trim()){alert('Teilname');return;} S.quotes.unshift({id:Date.now().toString(36),cid:S.cid,name:$('pname').value.trim()}); save(); openC(S.cid);}
load(); if(!S.custs.length) seed(); listCust();
</script></body></html>
