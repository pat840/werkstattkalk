<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WerkstattKalk</title>
<style>
:root{--bg:#121821;--bg2:#1a2332;--card:#222c3d;--line:#334058;--text:#eef3f8;--muted:#9aa8b8;--accent:#e8a23a;--ok:#3ecf8e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#1a2332f2;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#1a1408;display:grid;place-items:center;font-weight:800}
.brand{flex:1}.brand small{display:block;color:var(--muted);font-size:12px}
.icon,.btn{min-height:44px;border-radius:12px;font:inherit;cursor:pointer}
.icon{min-width:44px;border:1px solid var(--line);background:var(--card);color:var(--text)}
main{max-width:760px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:1.45rem;margin:.2rem 0 .6rem}h2{margin:0 0 10px;font-size:1.08rem}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.muted,.hint,.lede{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin:8px 0}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.btn{border:0;padding:12px 14px;font-weight:700}
.primary{background:var(--accent);color:#1a1408}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.link{background:none;border:0;color:#7eb0ff;cursor:pointer;padding:8px}
.item{background:var(--bg);border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ok{color:var(--ok);font-weight:700;text-align:right}.big{font-size:1.3rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg2);color:var(--text);width:min(92vw,440px);padding:16px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img,.filechip,.clogo{width:72px;height:72px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff}
.filechip{display:grid;place-items:center;font-size:11px;text-align:center;padding:6px;color:#111}
.clogo{width:40px;height:40px;border-radius:8px}
.check{flex-direction:row;align-items:center;gap:8px}.check input{min-height:auto;width:18px}
#sheet{display:none}
@media print{
 header,.no-print,dialog,#home,#cust,#part,#settings{display:none!important}
 body{background:#fff;color:#111}
 #sheet{display:block!important;max-width:100%;padding:0;margin:0}
 #sheet .head{display:flex;align-items:center;gap:12px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
 #sheet img.shop{height:48px}
 #sheet h1{font-size:20px;margin:0}
 #sheet table{width:100%;border-collapse:collapse}
 #sheet th,#sheet td{border:1px solid #ccc;padding:6px 8px;font-size:12px}
 #sheet th{background:#eee;text-align:left}
 #sheet td.r,#sheet th.r{text-align:right}
}
</style>
</head>
<body>
<header class="no-print">
<button type="button" class="icon" id="btnBack" hidden>Zurueck</button>
<div class="logo">WK</div>
<div class="brand"><strong id="headTitle">WerkstattKalk</strong><small id="headSub">Kunden und Angebote</small></div>
<button type="button" class="icon" id="btnSettings">Einst.</button>
</header>
<main id="home">
<p class="eyebrow">Kunden</p>
<h1>Kunde waehlen oder anlegen.</h1>
<div class="actions">
<button type="button" class="btn primary" id="btnNewCust">Neuer Kunde</button>
<button type="button" class="btn ghost" id="btnDemo">Beispiele laden</button>
</div>
<section class="card"><div id="custList"></div></section>
</main>
<main id="cust" class="hidden">
<p class="eyebrow" id="custEye">Kunde</p>
<h1 id="custTitle">Kunde</h1>
<div class="actions"><button type="button" class="btn primary" id="btnNewQuote">Neues Angebot</button></div>
<section class="card"><div id="quoteList"></div></section>
</main>
<main id="part" class="hidden">
<form id="form">
<section class="card">
<h2>Angebot</h2>
<div class="grid2">
<label>Angebotsnr. <input name="quoteNo" placeholder="01-0815"></label>
<label>Datum <input name="quoteDate" type="date"></label>
</div>
<label>Teil <input name="name" required></label>
<div class="grid2">
<label>Zeichnungsnr. <input name="drawingNo"></label>
<label>Stueckzahl <input name="qty" type="number" min="1" value="1"></label>
</div>
<div class="grid2">
<label>Werkstoff <select name="material" id="materialSel"></select></label>
<label>Dicke mm <input name="thicknessMm" type="number" min="0" step="0.1"></label>
</div>
<label>Notiz <textarea name="note" rows="3"></textarea></label>
</section>
<section class="card">
<h2>Zeichnung</h2>
<input type="file" id="fileInput" accept="image/*,.pdf" multiple>
<div class="thumbs" id="thumbs"></div>
</section>
<section class="card">
<h2>Tafel / Material</h2>
<div class="grid2">
<label>L mm <input name="lenMm" type="number"></label>
<label>B mm <input name="widMm" type="number"></label>
<label>kg <input name="weightKg" type="number" step="0.01"></label>
<label>Tafeln <input name="sheets" type="number" value="0"></label>
<label>Tafel EUR <input name="sheetPrice" type="number" step="0.01"></label>
<label>EUR/kg <input name="euroPerKg" type="number" step="0.01"></label>
</div>
<label class="check"><input type="checkbox" id="useSheetPrice"> Tafelpreis verwenden</label>
</section>
<section class="card"><div class="row"><h2>Prozesse</h2><button type="button" class="btn ghost" id="btnAdd">Prozess dazu</button></div><div id="procs"></div></section>
<section class="card"><div class="row"><h2>Zukaufteile</h2><button type="button" class="btn ghost" id="btnBuy">Teil dazu</button></div><div id="buys"></div></section>
<section class="card">
<h2>Summe</h2>
<div class="grid2">
<div><div class="muted">Lohn</div><div class="big" id="cLabor">-</div></div>
<div><div class="muted">Material</div><div class="big" id="cMat">-</div></div>
<div><div class="muted">Zukauf</div><div class="big" id="cBuy">-</div></div>
<div><div class="muted">Angebot</div><div class="big" id="cLot">-</div></div>
</div>
</section>
<div class="actions no-print">
<button class="btn primary" type="submit">Speichern</button>
<button class="btn ghost" type="button" id="btnRev">Als /2 speichern</button>
<button class="btn ghost" type="button" id="btnPrint">Drucken</button>
</div>
</form>
</main>
<main id="settings" class="hidden">
<section class="card">
<h2>Euer Firmenkopf (Druck)</h2>
<label>Firmenname <input id="shopName" placeholder="Eure Firma GmbH"></label>
<label>Adresse / Zeile 2 <input id="shopAddr" placeholder="Strasse, Ort"></label>
<label>Logo der eigenen Firma <input type="file" id="shopLogo" accept="image/*"></label>
<div id="shopPreview"></div>
</section>
<section class="card"><h2>Werkstoffe EUR/kg</h2><div id="matEditor"></div></section>
<section class="card">
<label>Verschnitt % <input id="scrapPct" type="number" value="15"></label>
<label>Aufschlag % <input id="markupPct" type="number" value="0"></label>
</section>
<section class="card"><h2>Stundensaetze</h2><div id="params"></div></section>
<div class="actions">
<button type="button" class="btn primary" id="btnSaveSet">Speichern</button>
</div>
</main>
<div id="sheet"></div>
<dialog id="dlg">
<form method="dialog">
<h3 id="dlgTitle">Eintrag</h3>
<div id="dlgBody"></div>
<div class="actions">
<button type="submit" class="btn ghost" value="cancel">Abbrechen</button>
<button type="button" class="btn primary" id="pok">OK</button>
</div>
</form>
</dialog>
<script src="https://raw.githack.com/pat840/werkstattkalk/main/app.js"></script>
</body>
</html>
